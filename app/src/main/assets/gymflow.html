<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GymFlow</title>
<style>
:root{--accent:#ff6b35;--ink:#fff;--bg:#0e1014;--card:#171a20;--card2:#20242c;--text:#f2f4f7;--muted:#8b93a1;--line:#2a2f38;--danger:#ff5d5d;--r:18px}
body.light{--bg:#f3f4f7;--card:#fff;--card2:#eceef2;--text:#14171c;--muted:#6b7280;--line:#e1e4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
input,select{font:inherit;color:inherit}
.app{max-width:1100px;margin:0 auto;padding:14px 16px 120px}
body.inwork .app{padding-bottom:150px}
h1{font-size:26px;margin:6px 0 14px;letter-spacing:-.02em}
h2{font-size:12px;margin:22px 4px 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}

/* hero */
.hero{background:var(--accent);color:var(--ink);padding:22px;border-radius:26px;margin-bottom:8px}
.hdate{font-size:14px;opacity:.85;font-weight:600}
.hlabel{margin-top:14px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.8;font-weight:700}
.htitle{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:2px 0 6px}
.hsub{opacity:.9;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.hbtns{display:flex;gap:8px;margin-top:18px}
.hbtn{background:var(--ink);color:var(--accent);padding:13px 20px;border-radius:14px;font-weight:800;flex:1}
.hbtn.alt{background:rgba(255,255,255,.18);color:var(--ink);flex:0 0 auto}
body.light .hbtn.alt{background:rgba(0,0,0,.12)}
.last{font-size:12.5px;color:var(--muted);margin:2px 6px 12px}
/* segmented */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 14px;border-radius:12px;background:var(--card2);white-space:nowrap;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--ink)}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2);margin-top:8px;width:100%;text-align:left}
.dayrow b{display:block}
.dnum{flex:0 0 44px;text-align:center;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.06em}.dnum b{display:block;font-size:22px;color:var(--accent);letter-spacing:0;line-height:1.1}
.dayrow span.small{display:block}.exlist{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.pick{display:block;width:100%;text-align:left}.pick.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--accent);color:var(--ink)}
.badge.soft{background:transparent;border:1px solid var(--line);color:var(--muted)}
/* ring */
.weekdots{display:flex;gap:6px;margin-top:12px}
.weekdots div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.weekdots i{display:block;height:8px;border-radius:9px;background:var(--card2);margin-bottom:5px}
.weekdots .p i{background:color-mix(in srgb,var(--accent) 30%,var(--card2))}.weekdots .y i{background:var(--accent)}.weekdots button{flex:1;text-align:center;font-size:11px;color:var(--muted)}.weekdots button.t{color:var(--text);font-weight:700}
.miss{border-color:var(--accent)}
.weekdots .t{color:var(--text);font-weight:700}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-size:18px;font-weight:700}
.stepper b{min-width:44px;text-align:center}
/* workout */
.wtop{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;align-items:center;gap:10px}
.wtop .t{font-weight:800;font-size:20px;line-height:1.1}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--muted);font-weight:600}
.pill.on{color:var(--accent)}
.btn{background:var(--accent);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:800}
.btn2{background:var(--card2);padding:10px 14px;border-radius:12px;font-weight:700}
.btn.danger{background:var(--danger);color:#fff}
.ex.complete{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.exhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.exname{font-weight:800;font-size:17px}
.exsub{font-size:12.5px;color:var(--muted);margin-top:2px}
.icon{width:34px;height:34px;border-radius:10px;background:var(--card2);font-size:18px;flex:0 0 auto}
.setrow{display:grid;grid-template-columns:38px 26px 1fr 50px 1fr 28px;gap:8px;align-items:center;padding:5px 0}
.setrow.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:0}
.setrow.head span:nth-child(3),.setrow.head span:nth-child(5){text-align:center}
.chk{width:36px;height:36px;border-radius:11px;border:2px solid var(--line);color:transparent;font-weight:900;font-size:17px}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.sn{text-align:center;color:var(--muted);font-weight:700}
.num{width:100%;min-width:0;text-align:center;background:var(--card2);border:1px solid transparent;border-radius:11px;padding:9px 4px;font-weight:700;font-size:16px}
.num:focus{outline:none;border-color:var(--accent)}
.setrow.done .num{background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
.unit{text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.x{color:var(--muted);font-size:20px;height:36px}
.exfoot{display:flex;gap:8px;margin-top:8px}
.ghost{flex:1;padding:10px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:14px}
/* rest */
#rest{position:fixed;left:12px;right:12px;bottom:84px;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;display:none;z-index:20;box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
body.inwork #rest{bottom:calc(14px + env(safe-area-inset-bottom))}
#rest.on{display:block}
#rest .rt{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#rest .bar{height:5px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--accent);width:0}
#rest.fin{border-color:var(--accent)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px}
nav button.on{color:var(--accent)}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.inwork nav{display:none}
/* history */
.hitem{display:block;width:100%;text-align:left}
.lock{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
.lock.ed{color:var(--accent)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card2);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0;padding-top:4px}
.srow .l{flex:1}.srow .l small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--text)}
.tog{width:48px;height:28px;border-radius:99px;background:var(--card2);position:relative;flex:0 0 auto;border:1px solid var(--line)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.tog.on{background:var(--accent)}.tog.on::after{left:23px;background:var(--ink)}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.field:focus{outline:none;border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:140px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:720px){.modal{align-items:center}.sheet{border-radius:24px}}
.mhead{display:flex;align-items:center;margin-bottom:12px}.mhead b{flex:1;font-size:18px}
.prow{display:flex;width:100%;text-align:left;padding:11px 12px;border-radius:12px;align-items:center}
.prow:active,.prow:hover{background:var(--card2)}
.prow small{margin-left:auto;color:var(--muted);font-size:12px}
.prow.quick{color:var(--accent);font-weight:700}
.mgroup{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:12px 12px 4px}
.dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1s;z-index:40}
.dim.on{opacity:.82;pointer-events:auto}
#alert{position:fixed;inset:0;background:var(--accent);color:var(--ink);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#alert.on{display:flex}
#alert .big{font-size:60px;font-weight:900;letter-spacing:-.03em;line-height:1}
#alert .nx{font-size:20px;font-weight:700;margin-top:20px}
#alert .nx2{font-size:15px;opacity:.85;margin-top:6px}
#alert .tap{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));font-size:14px;opacity:.75;font-weight:600}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#alert.on .big{animation:pop .35s ease-out}
#alert{overflow:hidden}#alert>*:not(.glow):not(.tap){position:relative}
#alert .glow{position:absolute;inset:-30%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.32),rgba(255,255,255,0) 55%);animation:breathe 2.6s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.85;transform:scale(1.06)}}
#alert.out{opacity:0;transition:opacity .35s}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;display:none}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
/* toast above the rest timer during workouts */
body.inwork .toast{bottom:calc(128px + env(safe-area-inset-bottom))}
/* two columns that scroll on their own (landscape / wide) */
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.col{min-width:0}
body.split{height:100vh;height:100dvh;overflow:hidden}
body.split .app{height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.split.inwork .app{padding-bottom:0}
body.split .cols{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body.split .col{overflow-y:auto;min-height:0;padding-bottom:24px;scrollbar-width:none;overscroll-behavior:contain}
body.split.inwork .col{padding-bottom:130px}
body.split .col::-webkit-scrollbar{display:none}
/* gym-day picker, notes, best sets, export */
.daypick{display:flex;gap:6px}.daypick button{width:34px;height:34px;border-radius:10px;background:var(--card2);font-weight:700;font-size:13px}.daypick button.on{background:var(--accent);color:var(--ink)}
.exnote{font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.bgroup{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 4px;display:flex;align-items:center;gap:6px}.bgroup i{width:8px;height:8px;border-radius:3px;display:inline-block}
.brow{padding:5px 0;gap:8px}
.expgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.expitem img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
.expitem span{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600}.expitem small{color:var(--muted);font-weight:500}
.expitem input{accent-color:var(--accent);width:18px;height:18px}
select.field{width:auto;padding:8px 10px}
/* ---------- glass look ---------- */
:root{color-scheme:dark;--glass:rgba(255,255,255,.07);--glassb:rgba(255,255,255,.14);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.1)}
html.light{color-scheme:light}
body.light{--glass:rgba(255,255,255,.55);--glassb:rgba(255,255,255,.85);--card2:rgba(20,23,28,.06);--line:rgba(20,23,28,.08)}
html{background:radial-gradient(90% 38% at 50% -6%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 72%),#0b0d12;background-attachment:fixed;min-height:100%}
html.light{background:radial-gradient(90% 38% at 50% -6%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 72%),#eef0f5;background-attachment:fixed}
html body{background:transparent}
.card,.kpi,#rest{background:var(--glass);border:1px solid var(--glassb);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.kpi{border-radius:14px}
.dayrow{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
body.light .dayrow{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.8)}
.hero{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 60%,transparent),color-mix(in srgb,var(--accent) 25%,transparent));border:1px solid color-mix(in srgb,var(--accent) 60%,rgba(255,255,255,.3));color:#fff;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
body.light .hero{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 88%,transparent),color-mix(in srgb,var(--accent) 60%,transparent))}
.hbtn{background:rgba(255,255,255,.92);color:var(--accent)}
.hbtn.alt,body.light .hbtn.alt{background:rgba(255,255,255,.2);color:#fff}
.chips span{background:rgba(255,255,255,.2)}
.ex.complete{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
nav{background:rgba(14,16,22,.55);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top:1px solid rgba(255,255,255,.12)}
body.light nav{background:rgba(255,255,255,.6);border-top-color:rgba(20,23,28,.06)}
.wtop{background:rgba(11,13,18,.5);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);margin:0 -16px;padding:8px 16px 10px}
body.light .wtop{background:rgba(238,240,245,.7)}
.sheet{background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.bestlift{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 22%,transparent),var(--glass))}
.blabel{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bname{font-size:20px;font-weight:800;margin-top:8px}.bset{font-size:28px;font-weight:900;letter-spacing:-.02em;margin:2px 0 4px}
.num{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.fx{transition:filter .3s ease,opacity .3s ease}
.fxdim{filter:blur(3px)!important;opacity:.14!important}
.card.focus{transform:scale(1.05);box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:6;position:relative}
.card{transition:transform .3s ease,box-shadow .3s ease}
.setrow{position:relative}
.setrow.frow>.num{opacity:0;transition:opacity .2s}
.setrow.frow>.unit{opacity:0}
.wpick{position:absolute;top:50%;height:230px;margin-top:-115px;display:grid;grid-template-columns:1fr 50px 1fr;gap:8px;align-items:center;pointer-events:none;z-index:3;
 -webkit-mask:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(transparent,#000 22%,#000 78%,transparent);opacity:0;transition:opacity .25s}
.wpick.on{opacity:1}
.wpick .pband{position:absolute;left:0;right:0;top:50%;height:40px;margin-top:-20px;border-radius:12px;background:rgba(255,255,255,.13)}
body.light .wpick .pband{background:rgba(20,23,28,.08)}
.wpick .wh{position:relative;height:100%;transform-style:preserve-3d;perspective:600px}
.wpick .n{position:absolute;left:0;right:0;top:50%;height:38px;margin-top:-19px;display:grid;place-items:center;backface-visibility:hidden}
.wpick .pu{position:relative;z-index:1;text-align:center;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div id="rest">
  <div class="row">
    <div><div class="small muted" id="rlabel">Rest</div><div class="rt" id="rtime">1:00</div></div>
    <div class="sp"></div>
    <button class="btn2" data-act="rminus">−15</button>
    <button class="btn2" data-act="rplus">+15</button>
    <button class="btn" data-act="rskip">Skip</button>
  </div>
  <div class="bar"><i id="rbar"></i></div>
</div>

<nav id="nav">
  <button data-act="nav" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-act="nav" data-v="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-act="nav" data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-act="nav" data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="dim" id="dim"></div>
<div id="alert" data-act="alertok"><div class="glow"></div><div class="big" id="atitle">Let's go!</div><div class="nx" id="anext"></div><div class="nx2" id="anext2"></div><div class="tap">Tap anywhere to continue</div></div>
<input type="file" id="fileSound" accept="audio/*" hidden>
<input type="file" id="fileRestore" accept="application/json,.json" hidden>

<script>
"use strict";
const NATIVE=!!window.Android;
const nat=(f,...a)=>{if(NATIVE)try{return window.Android[f](...a)}catch(e){}};
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const DAY=864e5;

let AC=null,master=null;const bufs={};
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.connect(AC.destination);loadBufs()}
 master.gain.value=S.settings.volume;if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function loadBufs(){SOUNDLIB.forEach(c=>{if(bufs[c.id])return;try{const b64=c.data.split(',')[1];const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 AC.decodeAudioData(u.buffer,b=>bufs[c.id]=b,()=>{})}catch(e){}})}
document.addEventListener('pointerdown',()=>ac(),{passive:true});
function tone(c,t,f,dur,type,peak,dest=master){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
const SOUNDS={
 chime:{n:'Chime',p:(c,t,d)=>[tone(c,t,1318.5,.9,'sine',.35,d),tone(c,t+.16,1760,1.1,'sine',.3,d)]},
 ding:{n:'Ding',p:(c,t,d)=>[tone(c,t,1046.5,1.3,'triangle',.4,d),tone(c,t,2093,.7,'sine',.1,d)]},
 rise:{n:'Rising',p:(c,t,d)=>[659.25,880,1174.66].map((f,i)=>tone(c,t+i*.12,f,.4,'sine',.28,d))},
 pulse:{n:'Soft pulse',p:(c,t,d)=>[0,.28,.56].map(x=>tone(c,t+x,523.25,.22,'sine',.38,d))},
 beep:{n:'Double beep',p:(c,t,d)=>[tone(c,t,880,.14,'square',.1,d),tone(c,t+.22,880,.14,'square',.1,d)]}};
function schedule(delay,id=S.settings.sound){const c=ac();if(!c)return[];const t=c.currentTime+Math.max(0,delay);
 if(id.startsWith('c_')){const b=bufs[id];if(b){const s=c.createBufferSource();s.buffer=b;s.connect(master);s.start(t);return[s]}id='chime'}
 return(SOUNDS[id]||SOUNDS.chime).p(c,t,master)}
/* render the chosen sound to a small audio file for the Android app */
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function toWav(ab){const d=ab.getChannelData(0),n=d.length,sr=ab.sampleRate,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}return buf}
let syncT;function syncSound(){if(!NATIVE)return;clearTimeout(syncT);syncT=setTimeout(async()=>{try{const id=S.settings.sound,sr=44100,O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O)return;let out;
 if(id.startsWith('c_')){const c=SOUNDLIB.find(x=>x.id===id);if(!c)return;const bin=atob(c.data.split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const dec=await new O(1,1,sr).decodeAudioData(u.buffer);const oc=new O(1,Math.ceil(sr*Math.min(dec.duration,6)),sr),g=oc.createGain();g.gain.value=S.settings.volume;g.connect(oc.destination);const src=oc.createBufferSource();src.buffer=dec;src.connect(g);src.start(0);out=await oc.startRendering()}
 else{const oc=new O(1,Math.ceil(sr*2.2),sr),g=oc.createGain();g.gain.value=S.settings.volume;g.connect(oc.destination);(SOUNDS[id]||SOUNDS.chime).p(oc,.02,g);out=await oc.startRendering()}
 nat('setSound',b64(toWav(out)))}catch(e){}},300)}

 if(e>Date.now()){T.end=e;if(!T.on){T.on=true;T.fired=false;T.total=Math.max(1,(e-Date.now())/1000)}$('#rest').classList.add('on');if(!T.iv)T.iv=setInterval(tickRest,200);tickRest()}

  n.style.opacity=c?1:Math.max(.2,.62-d*.12);n.style.filter=`blur(${Math.min(1.1,d*.3)}px)`;n.style.fontSize=(c?20:18-d*.5)+'px';n.style.fontWeight=c?800:500;n.style.color=c?'var(--text)':'var(--muted)';el.appendChild(n)}}

 const drums=pk.querySelectorAll('.wh');

 [...card.children].forEach(ch=>{if(ch===row)return;if(ch.classList.contains('exhead')){[...ch.querySelectorAll('.exsub,.icon')].forEach(z=>dim.push(z))}else dim.push(ch)});
 WH.dim=dim;dim.forEach(x=>{x.classList.add('fx');x.classList.add('fxdim')});
 inp.readOnly=true;inp.blur();row.classList.add('frow');card.classList.add('focus');requestAnimationFrame(()=>pk.classList.add('on'));
 if(navigator.vibrate)navigator.vibrate(8);return true}

 <div class="expgrid"><label class="expitem"><img src="${EXP.reel.toDataURL('image/png')}" alt="Reel / Story image"><span><input type="checkbox" id="xreel" checked>Reel / Story <small>9:16</small></span></label>
 <label class="expitem"><img src="${EXP.post.toDataURL('image/png')}" alt="Instagram post image"><span><input type="checkbox" id="xpost" checked>Instagram post <small>4:5</small></span></label></div>
 <div class="exfoot" style="margin-top:14px"><button class="btn2 sp" data-act="mclose">Cancel</button><button class="btn sp" data-act="savimg">${NATIVE?'Save to gallery':'Download'}</button></div>`)}
function saveImages(){if(!EXP)return;const sel=['reel','post'].filter(k=>$('#x'+k)&&$('#x'+k).checked);if(!sel.length)return toast('Pick at least one image');
 let ok=0;sel.forEach(k=>{const name=`${EXP.fname}-${k}.png`,cv=EXP[k];if(NATIVE){if(nat('saveImage',name,cv.toDataURL('image/png').split(',')[1]))ok++}else{cv.toBlob(b=>download(name,b));ok++}});
 closeModal();toast(NATIVE?(ok?`Saved ${ok} image${ok>1?'s':''} to Gallery`:'Could not save the images'):'Downloading…')}

const ACT={
 nav:b=>setView(b.dataset.v),
 resume:()=>setView('workout'),
 start:()=>{const d=todayDay();if(d)startWorkout(d)},
 quickstart:()=>startWorkout(null),
 change:()=>{const lv=S.settings.level;openModal(`<div class="mhead"><b>Pick today's workout</b><button class="icon" data-act="mclose">✕</button></div>${allDays(lv).map(d=>`<button class="prow" data-act="pickday" data-id="${d.id}">${esc(d.name)}<small>${esc(d.sub)}</small></button>`).join('')}<button class="prow quick" data-act="quickstart">Empty workout (quick add)</button>`)},
 pickday:b=>{S.pick=b.dataset.id;save();closeModal();render();window.scrollTo({top:0,behavior:'smooth'})},
 level:b=>{S.settings.level=b.dataset.k;S.pick=null;S.due=nextTrain(day0());save();render()},
 intensity:b=>{S.settings.intensity=b.dataset.k;save();render()},
 goal:b=>{const g=Math.max(1,Math.min(7,S.settings.goal+ +b.dataset.d));S.settings.goal=g;S.settings.tdays=DEF_DAYS[g].slice();S.due=nextTrain(day0());save();render()},
 tday:b=>{const i=+b.dataset.i,t=S.settings.tdays;const k=t.indexOf(i);if(k>=0){if(t.length>1)t.splice(k,1)}else{t.push(i);t.sort()}S.settings.goal=t.length;S.due=nextTrain(day0());save();render()},
 wdone:()=>{S.settings.onboarded=true;S.due=nextTrain(day0());save(true);UI.view='home';render();window.scrollTo(0,0)},
 bestall:()=>{UI.bestAll=!UI.bestAll;render()},
 savimg:()=>saveImages(),
 mcont:()=>{S.due=day0();save();render()},
 mskip:()=>{const mi=missedInfo();if(mi){const l=S.settings.level;S.rot[l]=(S.rot[l]||0)+mi.n}S.due=nextTrain(day0());save();render()},
 finish:()=>finishWorkout(),
 awake:()=>{S.settings.awake=S.settings.awake==='off'?'workout':'off';save();wantAwake();poke();toast(S.settings.awake==='off'?'Screen follows phone settings':'Screen stays on, dims after 15 s')},
 alertok:()=>hideAlert(),
 check:b=>{const w=getW(b.dataset.w),e=w.ex[b.dataset.e],si=+b.dataset.s,s=e.sets[si];if(!canToggle(e,si))return;
  if(!s.d){const noW=!BW.has(e.id)&&!(parseFloat(s.w)>0),noR=!(parseFloat(s.r)>0);
   if(noW||noR)return toast(noW&&noR?'Enter weight and reps first':noW?'Enter the weight first':(e.id==='plank'?'Enter the seconds first':'Enter the reps first'))}
  s.d=!s.d;save();render();if(b.dataset.w==='A'){if(s.d)startRest(S.settings.rest);else skipRest()}},
 addset:b=>{const w=getW(b.dataset.w),e=w.ex[b.dataset.e],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',u:S.settings.unit,r:'',p:l?(l.r||l.p):'',d:false});save();render()},
 delset:b=>{const w=getW(b.dataset.w),e=w.ex[b.dataset.e];e.sets.splice(b.dataset.s,1);save();render()},
 exmenu:b=>{const k=b.dataset.w,ei=b.dataset.e,e=getW(k).ex[ei];openModal(`<div class="mhead"><b>${esc(e.name)}</b><button class="icon" data-act="mclose">✕</button></div>
  <div class="small muted" style="margin-bottom:6px">Rename (applies everywhere from now on)</div><input class="field" id="rn" value="${esc(e.name)}">
  <div class="exfoot"><button class="btn sp" data-act="rename" data-w="${k}" data-e="${ei}">Save name</button></div>
  <div class="exfoot"><button class="btn2 sp" data-act="exmv" data-w="${k}" data-e="${ei}" data-d="-1">Move up</button><button class="btn2 sp" data-act="exmv" data-w="${k}" data-e="${ei}" data-d="1">Move down</button></div>
  <div class="exfoot"><button class="ghost" style="color:var(--danger)" data-act="exrm" data-w="${k}" data-e="${ei}">Remove from this workout</button></div>`)},
 rename:b=>{const w=getW(b.dataset.w),e=w.ex[b.dataset.e],n=$('#rn').value.trim();if(n){S.names[e.id]=n;e.name=n;if(S.active)S.active.ex.forEach(x=>{if(x.id===e.id)x.name=n})}save();closeModal();render()},
 exmv:b=>{const w=getW(b.dataset.w),i=+b.dataset.e,j=i+ +b.dataset.d;if(j>=0&&j<w.ex.length){[w.ex[i],w.ex[j]]=[w.ex[j],w.ex[i]]}save();closeModal();render()},
 exrm:b=>{getW(b.dataset.w).ex.splice(b.dataset.e,1);save();closeModal();render()},
 addex:()=>pickExercise(id=>{S.active.ex.push(mkEx(id,S.active.level==='custom'||!PROGRAMS[S.active.level]?3:PROGRAMS[S.active.level].sets[S.active.intensity],EX[id]&&EX[id].c?'6-10':'8-12'));save();render()}),
 histaddex:()=>pickExercise(id=>{const w=S.history.find(h=>h.id===UI.hist);if(w&&editable(w)){w.ex.push(mkEx(id,3,'8-12'));save();render()}}),
 pickex:b=>{const cb=PICK_CB;closeModal();cb&&cb(b.dataset.id)},
 quickadd:()=>{const n=$('#pq').value.trim();if(!n)return;const c={id:'cx_'+uid(),n,m:$('#pm').value};S.customEx.push(c);save();const cb=PICK_CB;closeModal();cb&&cb(c.id)},
 mclose:()=>closeModal(false),mno:()=>closeModal(false),myes:()=>closeModal(true),
 rminus:()=>adjRest(-15),rplus:()=>adjRest(15),rskip:()=>skipRest(),
 openhist:b=>{UI.hist=b.dataset.id;UI.view='hist';render();window.scrollTo(0,0)},
 histdel:async()=>{if(await confirmBox('Delete workout?','This removes it from history and stats.','Delete',true)){S.history=S.history.filter(h=>h.id!==UI.hist);save(true);UI.view='history';render()}},
 mprev:()=>{let {y,m}=UI.month;m--;if(m<0){m=11;y--}UI.month={y,m};render()},
 mnext:()=>{let {y,m}=UI.month;m++;if(m>11){m=0;y++}UI.month={y,m};render()},
 exportimg:()=>exportImage(),
 exportcsv:()=>{const {y,m}=UI.month,st=calcStats(y,m);if(!st.list.length)return toast('No workouts this month');download(`gymflow-${y}-${String(m+1).padStart(2,'0')}.csv`,new Blob([csvFor(st.list)],{type:'text/csv'}))},
 theme:b=>{S.settings.theme=b.dataset.k;save();applyTheme();render()},
 accent:b=>{S.settings.accent=b.dataset.k;save();applyTheme();render()},
 reststep:b=>{S.settings.rest=Math.max(15,Math.min(600,S.settings.rest+ +b.dataset.d));save();render()},
 unitdef:b=>{const U=b.dataset.k;S.settings.unit=U;if(S.active)S.active.ex.forEach(e=>e.sets.forEach(s=>{if(s.u!==U){if(s.w!=='')s.w=String(Math.round(conv(s.w,s.u,U)*10)/10);s.u=U}}));save();render()},
 awakeset:b=>{S.settings.awake=b.dataset.k;save();render();wantAwake()},
 sound:b=>{S.settings.sound=b.dataset.k;save();render();schedule(0);syncSound()},
 preview:b=>schedule(0,b.dataset.k),
 delsound:b=>{SOUNDLIB=SOUNDLIB.filter(c=>c.id!==b.dataset.k);if(S.settings.sound===b.dataset.k)S.settings.sound='chime';saveSounds();save();render()},
 addsound:()=>$('#fileSound').click(),
 vibrate:()=>{S.settings.vibrate=!S.settings.vibrate;nat('vibrate',S.settings.vibrate);save();render()},
 fsi:()=>nat('openFsiSettings'),
 manageex:()=>{const list=allExercises();openModal(`<div class="mhead"><b>Exercises</b><button class="icon" data-act="mclose">✕</button></div>
  <div class="small muted" style="margin-bottom:8px">Edit any name; changes save as you type. Custom ones can be deleted.</div>
  <div class="exfoot" style="margin-bottom:8px"><button class="btn sp" data-act="newex">+ New exercise</button></div>
  ${MUSCLES.map(m=>{const l=list.filter(x=>x.m===m);return l.length?`<div class="mgroup">${m}</div>`+l.map(x=>`<div class="row" style="margin:4px 0"><input class="field" data-rn="${x.id}" value="${esc(x.n)}">${x.id.startsWith('cx_')?`<button class="icon" data-act="delex" data-id="${x.id}">✕</button>`:''}</div>`).join(''):''}).join('')}`)},
 newex:()=>{closeModal();pickExercise(()=>{toast('Exercise added')})},
 delex:b=>{S.customEx=S.customEx.filter(c=>c.id!==b.dataset.id);delete S.names[b.dataset.id];save();ACT.manageex()},
 backup:()=>download(`gymflow-backup-${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify(S)],{type:'application/json'})),
 restore:()=>$('#fileRestore').click(),
 reset:async()=>{if(await confirmBox('Erase everything?','All workouts, settings and custom exercises will be deleted from this phone.','Erase',true)){S=defaults();save(true);applyTheme();UI.view='home';render()}},
 newday:()=>{const d={id:'cd_'+uid(),name:'Day '+(S.customDays.length+1),ex:[],sets:3};S.customDays.push(d);S.settings.level='custom';save();UI.dayEdit=d.id;UI.view='dayedit';render()},
 editday:b=>{UI.dayEdit=b.dataset.id;UI.view='dayedit';render()},
 daysets:b=>{const d=S.customDays.find(x=>x.id===UI.dayEdit);d.sets=Math.max(1,Math.min(10,(d.sets||3)+ +b.dataset.d));save();render()},
 dayaddex:()=>pickExercise(id=>{S.customDays.find(x=>x.id===UI.dayEdit).ex.push(id);save();render()}),
 daymv:b=>{const d=S.customDays.find(x=>x.id===UI.dayEdit),i=+b.dataset.i,j=i+ +b.dataset.d;if(j>=0&&j<d.ex.length)[d.ex[i],d.ex[j]]=[d.ex[j],d.ex[i]];save();render()},
 dayrm:b=>{S.customDays.find(x=>x.id===UI.dayEdit).ex.splice(+b.dataset.i,1);save();render()},
 delday:async()=>{if(await confirmBox('Delete this day?','Past workouts stay in history.','Delete',true)){S.customDays=S.customDays.filter(x=>x.id!==UI.dayEdit);if(S.pick===UI.dayEdit)S.pick=null;save();UI.view='settings';render()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b,e)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f){const w=getW(t.dataset.w);if(!w||!editable(w))return;w.ex[t.dataset.e].sets[t.dataset.s][t.dataset.f]=t.value.replace(',', '.');save()}
 else if(t.id==='pq')renderPick(t.value);
 else if(t.dataset.rn){const v=t.value.trim();if(v)S.names[t.dataset.rn]=v;else delete S.names[t.dataset.rn];save()}
 else if(t.id==='dayname'){S.customDays.find(x=>x.id===UI.dayEdit).name=t.value||'Untitled';save()}
 else if(t.id==='vol'){S.settings.volume=+t.value;if(master)master.gain.value=+t.value;save()}
 else if(t.id==='accpick'){S.settings.accent=t.value;applyTheme();save()}});
document.addEventListener('change',e=>{if(e.target.id==='sndsel'){S.settings.sound=e.target.value;save();render();schedule(0);syncSound()}if(e.target.id==='accpick')render();if(e.target.id==='vol'){schedule(0);syncSound()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pq'&&e.target.value.trim())ACT.quickadd()});
$('#fileSound').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>1.5e6)return toast('Clip too big — keep it under ~1 MB');
 const r=new FileReader();r.onload=()=>{const c={id:'c_'+uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,30),data:r.result};SOUNDLIB.push(c);if(!saveSounds()){SOUNDLIB.pop();return}S.settings.sound=c.id;save();if(AC)loadBufs();else ac();render();setTimeout(()=>schedule(0),400);syncSound()};r.readAsDataURL(f)});
$('#fileRestore').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.settings||!Array.isArray(p.history))throw 0;S={...defaults(),...p,settings:{...defaults().settings,...p.settings}};save(true);applyTheme();UI.view='home';render();toast('Data imported')}catch(err){toast('That file is not a GymFlow export')}};r.readAsText(f)});
setInterval(()=>{const el=$('#elapsed');if(el&&S.active)el.textContent=mmss(elapsed(S.active)/1000)},1000);
setInterval(()=>{if(UI.view==='history'||UI.view==='hist')render()},6e4);

applyTheme();render();wantAwake();
if(NATIVE){nat('vibrate',S.settings.vibrate);syncSound();if(S.active)nat('workoutStart',S.active.dayName,S.active.start);nativeRestSync()}
</script>
</body>
</html>
