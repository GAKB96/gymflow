name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GymFlow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GymFlow.apk
          path: GymFlow.apk

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GymFlow (latest build)
          make_latest: true
          files: GymFlow.apk

      - name: Save a copy on the apk branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rq --cached .
          git add -f GymFlow.apk
          git commit -m "APK from ${GITHUB_SHA::7}"
          git push -f origin apk
